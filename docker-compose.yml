# 本地基础设施与应用骨架，生产密钥通过环境变量提供。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: six_channel
      POSTGRES_USER: six_channel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 PostgreSQL 密码}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: ["etcd_data:/etcd"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MinIO 用户}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MinIO 密码}
    volumes: ["minio_data:/data"]
  milvus:
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on: [etcd, minio]
    ports: ["19530:19530"]
    volumes: ["milvus_data:/var/lib/milvus"]
  backend:
    profiles: [app]
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      MILVUS_MODE: remote
      MILVUS_URI: http://milvus:19530
      DATABASE_ENABLED: "true"
      CONSULTATION_STORAGE: postgres
      DATABASE_URL: postgresql+asyncpg://six_channel:${POSTGRES_PASSWORD}@postgres:5432/six_channel
      CHECKPOINT_BACKEND: postgres
      LANGGRAPH_DATABASE_URL: postgresql://six_channel:${POSTGRES_PASSWORD}@postgres:5432/six_channel
    depends_on: [postgres, milvus]
    ports: ["8000:8000"]
volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
